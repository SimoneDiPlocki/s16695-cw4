name: Zadanie 1 i 2 - Automatyzacja
on:
  push:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 #dodane ze względu na super-lintera

      - name: Konfiguracja Javy 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # --- Zadanie 1 ---

      # Uruchomienie aplikacji ("dry run") przy pomocy mvn exec
      - name: 1. Uruchomienie aplikacji (Dry run)
        run: mvn compile exec:java

      # --- Zadanie 2 ---

      # ZMIANA 2: Dodanie kroku z audytem jakości kodu zaraz po uruchomieniu
      - name: 2. Audyt jakosci kodu (Super-linter)
        uses: github/super-linter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_JAVA: true
          VALIDATE_XML: true

      # Wykonanie testów jednostkowych
      - name: 3. Wykonanie testow jednostkowych
        run: mvn test

      # Test pakowania aplikacji do formatu .jar
      - name: 4. Pakowanie aplikacji do pliku JAR
        run: mvn package

      # Przygotowanie zbudowanego pliku .jar do pobrania
      - name: 5. Udostepnienie pliku do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: gotowy-program
          path: target/*.jar
